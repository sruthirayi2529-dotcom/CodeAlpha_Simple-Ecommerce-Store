<!DOCTYPE html>
<html>
<head>
    <title>My E-commerce Store</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f5f5f5; padding: 20px; }
        h1 { margin-bottom: 20px; }
        #products { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .product { background: white; border-radius: 10px; padding: 15px; width: 220px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .product h3 { margin: 10px 0 5px; }
        button { padding: 8px 15px; background: black; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #333; }
        input { padding: 8px; width: 250px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>My Shop 🛍️</h1>
    <input type="email" placeholder="Enter your email" value="sruthiyadhav2007@gmail.com" />
    <button>Register</button>
    
    <div id="products">
        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="Headphones">
            <h3>Wireless Headphones</h3>
            <p>$50</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" alt="Watch">
            <h3>Smart Watch</h3>
            <p>$100</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Shoes">
            <h3>Running Shoes</h3>
            <p>$80</p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
